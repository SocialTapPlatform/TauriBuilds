name: Build SocialTap

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-macos-arm64:
    name: macOS ARM64 (Apple Silicon)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run tauri build -- --target aarch64-apple-darwin

      - uses: actions/upload-artifact@v4
        with:
          name: socialtap-macos-arm64
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/**

  build-windows-x64:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: socialtap-windows-x64
          path: src-tauri/target/release/bundle/**

  build-windows-arm64:
    name: Windows ARM64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run tauri build -- --target aarch64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: socialtap-windows-arm64
          path: src-tauri/target/aarch64-pc-windows-msvc/release/bundle/**

  build-linux-x64:
    name: Linux x64
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: socialtap-linux-x64
          path: src-tauri/target/release/bundle/**
